<svg xmlns="http://www.w3.org/2000/svg" width="810" height="670" viewBox="0 0 810 670"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#35566b"/></marker></defs><rect x="12" y="5" width="156" height="48" rx="7" fill="#f2f6fa" stroke="#35566b" stroke-width="1.4"/><text x="90.0" y="29" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17374b" text-anchor="middle">Cliente</text><path d="M90,53 V610" stroke="#b3c5d1" stroke-dasharray="5,5"/><rect x="222" y="5" width="156" height="48" rx="7" fill="#f2f6fa" stroke="#35566b" stroke-width="1.4"/><text x="300.0" y="29" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17374b" text-anchor="middle">API / Sesión</text><path d="M300,53 V610" stroke="#b3c5d1" stroke-dasharray="5,5"/><rect x="432" y="5" width="156" height="48" rx="7" fill="#f2f6fa" stroke="#35566b" stroke-width="1.4"/><text x="510.0" y="29" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17374b" text-anchor="middle">Sala / Core</text><path d="M510,53 V610" stroke="#b3c5d1" stroke-dasharray="5,5"/><rect x="642" y="5" width="156" height="48" rx="7" fill="#f2f6fa" stroke="#35566b" stroke-width="1.4"/><text x="720.0" y="29" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#17374b" text-anchor="middle">MySQL</text><path d="M720,53 V610" stroke="#b3c5d1" stroke-dasharray="5,5"/><path d="M90,95 L300,95" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="195.0" y="86" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">1. Login HTTP</text><path d="M300,145 L720,145" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="510.0" y="136" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">2. Consultar usuario y verificar hash</text><path d="M300,195 L90,195" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="195.0" y="186" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">3. Token de sesión</text><path d="M90,245 L300,245" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="195.0" y="236" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">4. /ws/juego: token, cola, equipo, avión</text><path d="M300,295 L510,295" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="405.0" y="286" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">5. Esperar 3 azules + 3 rojos</text><path d="M510,345 L90,345" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="300.0" y="336" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">6. start: participantes y obstáculos</text><path d="M90,395 L510,395" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="300.0" y="386" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">7. input: x, y, disparar</text><path d="M510,455 L90,455" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="300.0" y="446" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">8. f: estado tras actualizar el tick</text><path d="M510,515 L720,515" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="615.0" y="506" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">9. Guardar resultado al terminar</text><path d="M510,575 L90,575" stroke="#35566b" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="300.0" y="566" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#17374b" text-anchor="middle">10. end: ganador, id y duración</text><text x="405" y="647" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#17374b" text-anchor="middle">Los pasos 7–8 se repiten durante el combate; objetivo configurado: 30 ticks/s.</text></svg>
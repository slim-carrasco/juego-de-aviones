services:
  postgres:
    image: postgres:16-alpine
    container_name: juegoaviones-postgres
    environment:
      POSTGRES_DB: juegoaviones
      POSTGRES_USER: juego
      POSTGRES_PASSWORD: juego_dev
    ports:
      - "5432:5432"
    volumes:
      - juegoaviones-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juego -d juegoaviones"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  juegoaviones-postgres-data:

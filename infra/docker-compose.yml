services:
  mysql:
    image: mysql:8.4
    container_name: juegoaviones-mysql
    environment:
      MYSQL_DATABASE: juegoaviones
      MYSQL_USER: juego
      MYSQL_PASSWORD: juego_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "127.0.0.1:3307:3306"
      - "172.17.0.1:3307:3306"
    volumes:
      - juegoaviones-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  juegoaviones-mysql-data:
